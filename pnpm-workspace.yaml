packages:
  - '.'

# Force patched versions of transitive dependencies flagged by security
# advisories that their (unmaintained or slow-moving) parents still pull in.
# Renovate manages these entries; drop one once the parent ships the fix.
overrides:
  # monaco-editor bundles an old dompurify; align it with our direct 3.4.13.
  dompurify@<3.4.13: 3.4.14

allowBuilds:
  esbuild: true
  # tesseract.js' only postinstall is opencollective-postinstall (a funding
  # message); nothing needs building, so skip it.
  tesseract.js: false

# First-party fork we publish ourselves; allow it past the minimum-release-age
# supply-chain gate that would otherwise reject a version freshly published from
# our own release pipeline. Safe to drop once 0.9.1 clears the age window.
minimumReleaseAgeExclude:
  - '@thetechnetwork/composerize-ts@0.9.1'
