# Manually refresh the visual-regression golden snapshots on CI's pinned
# Chromium, then commit them back to the branch the workflow was dispatched on.
#
# Run this from the Actions tab (workflow_dispatch) after an intentional UI
# change to a tool covered by src/visual-regression.e2e.spec.ts, or when adding
# new visual cases whose goldens must be generated on the CI browser. Pick a
# feature/PR branch when dispatching — if the selected branch is protected the
# final push will be rejected (the regenerated PNGs are still available in the
# run for download).
name: visual-regression-update

on:
  workflow_dispatch:

concurrency:
  group: visual-regression-update-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update-goldens:
    runs-on: ubuntu-24.04
    # Regenerating ~95 screenshots across all three browsers takes a while;
    # give it generous headroom over the ~15 min the e2e job uses per browser.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - run: corepack enable

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Get Playwright version
        id: playwright-version
        run: echo "PLAYWRIGHT_VERSION=$(node -p "require('./package.json').devDependencies['@playwright/test']")" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright browsers cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-24.04-all-${{ steps.playwright-version.outputs.PLAYWRIGHT_VERSION }}

      - name: Install Playwright browsers + system dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium firefox webkit
        timeout-minutes: 8

      - name: Install Playwright system dependencies only
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium firefox webkit
        timeout-minutes: 10

      - name: Build app
        run: pnpm build

      # --retries=0 is essential here: with the config's CI retries, Playwright
      # treats each rewritten snapshot as a "failure" and retries it, tripling
      # the run. We just want one write per snapshot. The step may still exit
      # non-zero because updated snapshots are reported as failures, so the
      # commit step below runs with `if: always()`.
      - name: Regenerate goldens on the CI browsers (all projects)
        run: pnpm exec playwright test src/visual-regression.e2e.spec.ts --update-snapshots --retries=0

      - name: Upload regenerated goldens
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-goldens
          path: src/**/*-snapshots/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit updated goldens
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Goldens already match this branch — nothing to commit."
          else
            git commit -m "test(e2e): refresh visual-regression goldens [skip ci]"
            git push
          fi
