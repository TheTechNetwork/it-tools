# Validate that pull request titles follow the Conventional Commits format.
# The release automation builds the changelog from commit/PR titles
# (scripts/getLatestChangelog.mjs), so a non-conventional title would produce a
# malformed changelog entry. This keeps that input clean.

name: pr-title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    # Skip drafts — a work-in-progress title (e.g. an agent's "[WIP] …"
    # placeholder) isn't final yet. The `ready_for_review` trigger re-runs this
    # the moment a draft is marked ready, so the title is still validated before
    # it can be merged.
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Validate PR title
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
